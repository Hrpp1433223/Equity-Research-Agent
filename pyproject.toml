[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "equity-research-agent"
version = "2.0.0"
description = "Public-data equity research tools, local reports and bounded model workflows"
requires-python = ">=3.10"
dependencies = ["python-docx==1.2.0", "Pillow==12.3.0", "pdfplumber==0.11.9", "pypdf==6.10.0", "lxml==6.1.1"]

[project.optional-dependencies]
test = ["pytest==9.0.3"]

[project.scripts]
equity-research = "equity_research_agent.cli:main"

[tool.setuptools.packages.find]
include = ["equity_research_agent*"]

[tool.setuptools.package-data]
equity_research_agent = ["*.html", "*.js"]
